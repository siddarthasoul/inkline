
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: inkline-api:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
